[project]
name = "my-agent-2"
version = "0.1.0"
description = "科研论文管理 Agent：论文解读报告、创新点抽取与推荐、论文库混合检索问答（LangChain + LangGraph）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "jieba>=0.42.1",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.5",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.0.0",
    "milvus-lite>=3.2.0",
    "numpy>=2.5.2",
    "pydantic>=2.13.4",
    "pymilvus>=3.0.1",
    "pymupdf>=1.28.2",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
]
